{% extends "base.html" %}

{% block title %}新增店家 - 逢甲美食評論網{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center my-4">
    <div class="col-lg-8">
        <div class="glass-panel p-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <a href="{{ url_for('restaurant.list_restaurants') }}" class="btn btn-outline-custom">
                    <i class="bi bi-arrow-left-short me-1"></i>返回探索
                </a>
                <span class="badge bg-primary px-3 py-2"><i class="bi bi-shop me-1"></i>校園美食提報</span>
            </div>

            <div class="text-center mb-5">
                <i class="bi bi-plus-circle fs-1 text-accent animate-pulse"></i>
                <h2 class="mt-3 text-light fw-bold">新增逢甲周邊店家</h2>
                <p class="text-secondary">填寫以下資訊，與全校師生分享這家美味的好店</p>
            </div>

            <form action="{{ url_for('restaurant.new_restaurant') }}" method="POST">
                <!-- 店家名稱與校區區域 -->
                <div class="row">
                    <div class="col-md-7 mb-4">
                        <label for="name" class="form-label text-secondary fw-semibold">店家名稱 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control form-control-custom py-3" id="name" name="name" placeholder="例如：逢甲阿華海產粥" required>
                    </div>
                    <div class="col-md-5 mb-4">
                        <label for="landmark" class="form-label text-secondary fw-semibold">地理校區位置 <span class="text-danger">*</span></label>
                        <select class="form-select form-control-custom py-3" id="landmark" name="landmark" required>
                            <option value="" disabled selected>請選擇店家區域...</option>
                            {% for lm in landmarks %}
                                <option value="{{ lm }}">{{ lm }}周區</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <!-- 店家地址 -->
                <div class="mb-4">
                    <label for="address" class="form-label text-secondary fw-semibold">店家地址 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control form-control-custom py-3" id="address" name="address" placeholder="例如：台中市西屯區文華路100號" required>
                </div>

                <!-- 聯絡電話與營業時間 -->
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label for="phone" class="form-label text-secondary fw-semibold">聯絡電話</label>
                        <input type="text" class="form-control form-control-custom py-3" id="phone" name="phone" placeholder="例如：04-24517250 (選填)">
                    </div>
                    <div class="col-md-6 mb-4">
                        <label for="opening_hours" class="form-label text-secondary fw-semibold">營業時間</label>
                        <input type="text" class="form-control form-control-custom py-3" id="opening_hours" name="opening_hours" placeholder="例如：11:00 - 21:00 (選填)">
                    </div>
                </div>

                <!-- 店家痛點標籤 (多選) -->
                <div class="mb-5">
                    <label class="form-label text-secondary fw-semibold mb-3">店家特點標籤 (多選)</label>
                    <div class="d-flex flex-wrap gap-2">
                        {% for tag in tags %}
                            <div class="tag-checkbox">
                                <input type="checkbox" name="tags" value="{{ tag.name }}" id="new-tag-{{ tag.id }}" class="btn-check">
                                <label class="btn btn-sm btn-outline-custom rounded-pill px-4 py-2 text-nowrap" for="new-tag-{{ tag.id }}">
                                    {{ tag.name }}
                                </label>
                            </div>
                        {% endfor %}
                    </div>
                    <div class="form-text text-muted mt-2">勾選符合該店的特點，方便其他同學透過痛點標籤進行精準檢索。</div>
                </div>

                <!-- 提交表單 -->
                <button type="submit" class="btn btn-primary-custom w-100 py-3 fs-5">
                    <i class="bi bi-check2-circle me-1"></i>確認新增店家
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // 更新標籤按鈕選取狀態樣式
    document.addEventListener('DOMContentLoaded', () => {
        const checkLabels = document.querySelectorAll('.tag-checkbox label');
        checkLabels.forEach(label => {
            const checkbox = document.getElementById(label.getAttribute('for'));
            checkbox.addEventListener('change', () => {
                if (checkbox.checked) {
                    label.classList.add('selected');
                } else {
                    label.classList.remove('selected');
                }
            });
        });
    });
</script>
{% endblock %}
