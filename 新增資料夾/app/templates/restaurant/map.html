{% extends "base.html" %}

{% block title %}美食地圖 - 逢甲美食評論網{% endblock %}

{% block styles %}
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
    #map {
        height: 600px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-md);
        z-index: 1;
        transition: filter 0.3s ease;
    }
    
    /* 讓 Leaflet 配合深色模式 */
    [data-theme="dark"] #map {
        filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
    }

    /* 自訂 Popup 樣式使其符合毛玻璃與主色調 */
    .leaflet-popup-content-wrapper {
        background: var(--bg-surface-solid) !important;
        color: var(--text-primary) !important;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        backdrop-filter: blur(10px);
        box-shadow: var(--shadow-md);
    }
    
    .leaflet-popup-tip {
        background: var(--bg-surface-solid) !important;
        border: 1px solid var(--border-color);
    }

    .leaflet-popup-content {
        font-family: var(--font-body);
        font-size: 0.9rem;
        margin: 12px 16px;
    }

    .leaflet-popup-content h5 {
        font-family: var(--font-heading);
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--text-primary);
    }

    .leaflet-popup-content .popup-meta {
        font-size: 0.8rem;
        color: var(--text-secondary);
        margin-bottom: 4px;
    }

    .leaflet-popup-content .popup-btn {
        margin-top: 10px;
        display: inline-block;
        width: 100%;
        text-align: center;
        padding: 5px 0;
        font-size: 0.8rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <div class="glass-panel p-4 mb-4">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div>
                    <h2 class="text-light fw-bold m-0">
                        <i class="bi bi-map-fill text-primary me-2"></i>逢甲美食地圖
                    </h2>
                    <p class="text-secondary m-0 mt-1">在地圖上直觀探索逢甲周邊美食，點擊地標查看評價！</p>
                </div>
                <div>
                    <span class="badge bg-secondary-custom px-3 py-2 text-secondary">
                        <i class="bi bi-geo-alt-fill text-danger me-1"></i>共標記了 <strong class="text-light" id="marker-count">0</strong> 間餐廳
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div id="map"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // 1. 初始化地圖，中心點設在逢甲大學積學堂/正門附近
        const fcuCenter = [24.179049, 120.648041];
        const map = L.map('map').setView(fcuCenter, 16);

        // 2. 載入 OpenStreetMap 圖磚
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // 3. 餐廳資料集
        const restaurants = [
            {% for r in restaurants %}
                {
                    id: {{ r.id }},
                    name: {{ r.name | tojson }},
                    address: {{ r.address | tojson }},
                    phone: {{ r.phone | tojson }},
                    opening_hours: {{ r.opening_hours | tojson }},
                    landmark: {{ r.landmark | tojson }},
                    avg_rating: {{ r.avg_rating }},
                    avg_cp: {{ r.avg_cp }},
                    latitude: {{ r.latitude | tojson }},
                    longitude: {{ r.longitude | tojson }}
                },
            {% endfor %}
        ];

        let markedCount = 0;

        // 4. 繪製標記
        restaurants.forEach(r => {
            if (r.latitude && r.longitude) {
                markedCount++;
                const marker = L.marker([r.latitude, r.longitude]).addTo(map);
                
                // 產生 Popup HTML 內容
                let popupContent = `
                    <h5>${r.name}</h5>
                    <div class="popup-meta"><i class="bi bi-geo-alt-fill text-danger me-1"></i>${r.address}</div>
                `;
                if (r.phone) {
                    popupContent += `<div class="popup-meta"><i class="bi bi-telephone-fill text-primary me-1"></i>${r.phone}</div>`;
                }
                popupContent += `
                    <div class="d-flex gap-2 my-2">
                        <span class="badge bg-primary-subtle text-primary"><i class="bi bi-star-fill text-warning me-1"></i>${r.avg_rating}</span>
                        <span class="badge bg-info-subtle text-info"><i class="bi bi-lightning-charge-fill text-warning me-1"></i>CP ${r.avg_cp}</span>
                    </div>
                    <a href="/restaurants/${r.id}" class="btn btn-primary-custom btn-sm popup-btn text-white">
                        <i class="bi bi-eye me-1"></i>查看詳情
                    </a>
                `;
                
                marker.bindPopup(popupContent);
            }
        });

        // 5. 更新標記數量顯示
        document.getElementById('marker-count').textContent = markedCount;
    });
</script>
{% endblock %}
